[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcfit"
version = "0.1.0"
description = "Portable AI skill for McDonald's China single-meal nutrition and local intake records"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".agents/skills/mcfit/scripts"]
